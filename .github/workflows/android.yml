name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure executable permissions
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK for Artifact
        run: |
          mkdir -p release_apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release_apk/TubePremium-v1.0.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubePremium-v1.0-APK
          path: release_apk/TubePremium-v1.0.apk
          retention-days: 30
